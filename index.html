<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Coreano</title>
    <style>
        :root {
            --primary: #e11d48; /* Un rojo más vibrante */
            --bg: #f8fafc;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 { text-align: center; color: #0f172a; }

        /* Buscador y Filtros */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        #searchInput {
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        #searchInput:focus { border-color: var(--primary); }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            padding: 8px 18px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Tabla Estilizada */
        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f1f5f9;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        .img-producto {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            background: #f1f5f9;
            color: #475569;
        }

        .precio { font-weight: bold; color: var(--primary); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Catálogo de Productos</h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Buscar por nombre...">
        <div class="categories" id="categoryFilters">
            <!-- Los botones se generan solos aquí -->
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#ID</th>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody id="productTable">
                <!-- El inventario se carga aquí -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Tu data original
    const inventario = [
        { id: 1, nombre: "Pap retornable 2.5L", precio: 2400, cat: "Bebidas", img: "mellys/PAP25R.png", cant: 0 },
        { id: 2, nombre: "Pepsi Zero retornable 2.5L", precio: 2400, cat: "Bebidas", img: "mellys/PEPSI025R.png", cant: 0 },
        { id: 3, nombre: "Ginger Ale retornable 2.5L", precio: 2400, cat: "Bebidas", img: "mellys/GINGER25R.png", cant: 0 },
        { id: 4, nombre: "Pepsi retornable 2.5L", precio: 2400, cat: "Bebidas", img: "mellys/PEPSI25R.png", cant: 0 },
        { id: 5, nombre: "Bilz retornable 2.5L", precio: 2400, cat: "Bebidas", img: "mellys/BILZ25R.png", cant: 0 },
        { id: 6, nombre: "Limon soda retornable 2.5L", precio: 2400, cat: "Bebidas", img: "mellys/Limón.png", cant: 0 },
        { id: 7, nombre: "Kem piña retornable 2.5L", precio: 2400, cat: "Bebidas", img: "imellys/KEM25R.png", cant: 0 },
        { id: 8, nombre: "Vital Sin Gas", precio: 1100, cat: "Bebidas", img: "mellys/Vital1.png", cant: 0 },
        { id: 9, nombre: "Vital Con Gas", precio: 1100, cat: "Bebidas", img: "mellys/Vital2.png", cant: 0 },
        { id: 10, nombre: "Monster 473ml Variedades", precio: 1900, cat: "Bebidas", img: "mellys/Monster.png", cant: 0 },
        { id: 11, nombre: "Benedictino ", precio: 1500, cat: "Bebidas", img: "mellys/Benedictino1.png", cant: 0 }
    ];

    const productTable = document.getElementById('productTable');
    const categoryFilters = document.getElementById('categoryFilters');
    const searchInput = document.getElementById('searchInput');

    let currentCategory = "Todos";

    // 1. Iniciar la página
    function init() {
        renderProducts();
        renderCategories();
    }

    // 2. Renderizar filas de la tabla
    function renderProducts() {
        const query = searchInput.value.toLowerCase();
        productTable.innerHTML = "";

        inventario.forEach(prod => {
            const matchesSearch = prod.nombre.toLowerCase().includes(query);
            const matchesCat = currentCategory === "Todos" || prod.cat === currentCategory;

            if (matchesSearch && matchesCat) {
                const row = `
                    <tr>
                        <td>${prod.id}</td>
                        <td><img src="${prod.img}" class="img-producto" alt="${prod.nombre}"></td>
                        <td><strong>${prod.nombre}</strong></td>
                        <td><span class="badge">${prod.cat}</span></td>
                        <td class="precio">$${prod.precio}</td>
                    </tr>
                `;
                productTable.innerHTML += row;
            }
        });
    }

    // 3. Crear botones de categorías dinámicamente
    function renderCategories() {
        const cats = ["Todos", ...new Set(inventario.map(p => p.cat))];
        categoryFilters.innerHTML = "";
        
        cats.forEach(c => {
            const btn = document.createElement('button');
            btn.className = `cat-btn ${c === currentCategory ? 'active' : ''}`;
            btn.innerText = c;
            btn.onclick = () => {
                currentCategory = c;
                renderCategories(); // Repinta botones para mover la clase 'active'
                renderProducts();
            };
            categoryFilters.appendChild(btn);
        });
    }

    // 4. Escuchar el buscador
    searchInput.addEventListener('input', renderProducts);

    init();
</script>

</body>
</html>
