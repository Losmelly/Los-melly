<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losmelly.cl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --melly-pink: #d13d6b; --melly-blue: #1e4b8f; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .cart-sidebar { transition: transform 0.3s ease-in-out; }
        .detail-expansion { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .detail-expansion.open { max-height: 300px; padding: 10px 0; }
        .admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .logo-btn img { width: 100%; height: 100%; object-fit: cover; }
        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 1.5rem; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ff0000; color: white; font-size: 12px; font-weight: bold; height: 22px; width: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; display: none; }
    </style>
</head>
<body class="bg-white font-sans text-gray-800">

    <header style="background-color: var(--melly-pink);" class="p-4 flex justify-between items-center shadow-md sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <button onclick="checkAdmin()" class="logo-btn w-16 h-16 bg-white rounded-full p-0 border-2 border-white shadow-lg overflow-hidden transition active:scale-95 flex items-center justify-center">
                <img src="logo.png" alt="Mellys" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <span class="hidden font-black text-[10px] text-pink-600 text-center">ADMIN</span>
            </button>
            <h1 class="text-3xl font-black italic text-white tracking-tighter">Losmelly.cl</h1>
        </div>
        <button onclick="toggleCart()" class="relative text-4xl text-white mr-2">
            <i class="fas fa-shopping-cart"></i>
            <div id="cartCountBadge" class="cart-badge">0</div>
        </button>
    </header>

    <div class="px-6 mt-8">
        <input type="text" id="searchInput" onkeyup="renderProducts()" placeholder="Encuentra lo que buscas..." class="w-full max-w-4xl mx-auto block border-4 border-blue-900 rounded-full py-3 px-8 text-center font-bold text-lg italic text-pink-500 focus:outline-none">
    </div>
    <div id="categoryContainer" class="flex gap-4 overflow-x-auto px-6 py-6 no-scrollbar items-center"></div>

    <main class="px-6 pb-24 max-w-6xl mx-auto">
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="cartSidebar" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-white border-l-8 border-blue-900 z-50 transform translate-x-full cart-sidebar flex flex-col shadow-2xl">
        <div class="p-6 border-b-2 flex flex-col items-center relative">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-3xl font-black">&times;</button>
            <i class="fas fa-shopping-cart text-5xl mb-2 text-blue-900"></i>
            <h2 class="font-black uppercase tracking-widest text-lg">Tu Pedido</h2>
        </div>
        <div id="cartItems" class="flex-grow overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 border-t-4 border-blue-900 bg-gray-50 space-y-4">
            <input type="text" id="u_nombre" placeholder="Nombre de quien recibe" class="w-full border-2 border-blue-900 p-3 rounded-xl font-bold">
            <input type="tel" id="u_tel" placeholder="Número de contacto" class="w-full border-2 border-blue-900 p-3 rounded-xl font-bold">
            <textarea id="u_notas" placeholder="Instrucciones adicionales..." class="w-full border-2 border-blue-900 p-3 rounded-xl font-bold h-20"></textarea>
            <div class="flex justify-between items-center px-2 font-black text-2xl">
                <span>Total:</span> <span id="cartTotal" class="text-blue-900">$0</span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-blue-900 text-white font-black py-4 rounded-2xl text-xl uppercase shadow-lg">¡Encargar por WhatsApp!</button>
        </div>
    </div>

    <div id="adminModal" class="admin-modal">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-blue-900 uppercase italic">Admin Mellys</h2>
                <button onclick="closeAdmin()" class="text-3xl">&times;</button>
            </div>
            <div class="space-y-4">
                <input type="text" id="p_nombre" placeholder="Nombre del producto" class="w-full border-2 p-3 rounded-xl font-bold">
                <input type="number" id="p_precio" placeholder="Precio ($)" class="w-full border-2 p-3 rounded-xl font-bold">
                <input type="text" id="p_cat" placeholder="Categoría" class="w-full border-2 p-3 rounded-xl font-bold">
                <textarea id="p_desc" placeholder="Detalles" class="w-full border-2 p-3 rounded-xl h-20 font-bold"></textarea>
                <div class="border-2 border-dashed border-pink-300 p-4 rounded-xl text-center">
                    <input type="file" id="p_foto" accept="image/*" class="w-full text-xs">
                </div>
                <button onclick="addNewProduct()" class="w-full bg-green-600 text-white font-black py-3 rounded-xl uppercase shadow-md active:scale-95 transition">Guardar Artículo</button>
            </div>
            <hr class="my-6 border-2">
            <div id="adminList" class="space-y-2"></div>
        </div>
    </div>

    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 hidden z-40 backdrop-blur-sm"></div>

    <script>
        const WHATSAPP_NUMBER = "56953596111";

        // --- LISTA DE PRODUCTOS ---
        let productosFijos = [
            { id: 101, nombre: "Combo Familiar", precio: 12000, cat: "Oferta", desc: "Lo mejor para compartir", foto: null },
            { id: 102, nombre: "Galletas Los Mellys", precio: 4500, cat: "Dulces", desc: "Receta secreta", foto: null },
            { id: 103, nombre: "Bebida Pap 3L", precio: 2800, cat: "Bebidas", desc: "Fría", foto: null }
        ];

        let productosExtra = JSON.parse(localStorage.getItem('mellys_db')) || [];
        let productos = [...productosFijos, ...productosExtra];
        let cart = [];

        function checkAdmin() {
            if (prompt("Contraseña:") === "Garrits") {
                document.getElementById('adminModal').style.display = 'flex';
                renderAdminList();
            }
        }

        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

        function addNewProduct() {
            const n = document.getElementById('p_nombre').value;
            const p = document.getElementById('p_precio').value;
            const c = document.getElementById('p_cat').value || "General";
            const d = document.getElementById('p_desc').value;
            const fotoFile = document.getElementById('p_foto').files[0];

            if(!n || !p) return alert("Falta nombre o precio");

            if (fotoFile) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    const nuevo = { id: Date.now(), nombre: n, precio: parseInt(p), cat: c, desc: d, foto: reader.result };
                    productosExtra.push(nuevo);
                    saveAndRefresh();
                }
                reader.readAsDataURL(fotoFile);
            } else {
                productosExtra.push({ id: Date.now(), nombre: n, precio: parseInt(p), cat: c, desc: d, foto: null });
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('mellys_db', JSON.stringify(productosExtra));
            productos = [...productosFijos, ...productosExtra];
            renderProducts();
            renderAdminList();
            closeAdmin();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            const sorted = [...productos].sort((a,b) => a.cat === 'Oferta' ? -1 : 1);

            sorted.forEach(p => {
                if(search && !p.nombre.toLowerCase().includes(search)) return;
                const fotoHtml = p.foto ? `<img src="${p.foto}" class="product-img mb-4">` : `<div class="w-full h-44 bg-gray-100 rounded-3xl mb-4 flex items-center justify-center text-5xl">📦</div>`;
                grid.innerHTML += `
                    <div class="border-4 border-blue-900 rounded-[2.5rem] p-5 text-center bg-white shadow-xl flex flex-col items-center">
                        ${fotoHtml}
                        <h3 class="font-black uppercase text-lg mb-1">${p.nombre}</h3>
                        <p class="font-black text-2xl text-pink-600 mb-4 italic">$${p.precio.toLocaleString('es-CL')}</p>
                        <button onclick="addToCart(${p.id})" class="border-4 border-blue-900 rounded-full w-full py-2 font-black uppercase hover:bg-blue-900 hover:text-white transition">Agregar</button>
                    </div>`;
            });
            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            const uniqueCats = ['Todos', ...new Set(productos.map(p => p.cat))];
            container.innerHTML = uniqueCats.map(c => `<button onclick="filterByCat('${c}')" class="border-4 border-blue-900 rounded-2xl px-6 py-2 font-black uppercase whitespace-nowrap transition ${c === 'Oferta' ? 'bg-red-500 text-white' : 'hover:bg-blue-900 hover:text-white'}">${c}</button>`).join('');
        }

        function filterByCat(cat) {
            if(cat === 'Todos') return renderProducts();
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            productos.filter(p => p.cat === cat).forEach(p => {
                const fotoHtml = p.foto ? `<img src="${p.foto}" class="product-img mb-4">` : `<div class="w-full h-44 bg-gray-100 rounded-3xl mb-4 flex items-center justify-center text-5xl">📦</div>`;
                grid.innerHTML += `<div class="border-4 border-blue-900 rounded-[2.5rem] p-5 text-center bg-white shadow-xl flex flex-col items-center">${fotoHtml}<h3 class="font-black uppercase text-lg mb-1">${p.nombre}</h3><p class="font-black text-2xl text-pink-600 mb-4 italic">$${p.precio.toLocaleString('es-CL')}</p><button onclick="addToCart(${p.id})" class="border-4 border-blue-900 rounded-full w-full py-2 font-black uppercase hover:bg-blue-900 hover:text-white transition">Agregar</button></div>`;
            });
        }

        function toggleCart() { 
            document.getElementById('cartSidebar').classList.toggle('translate-x-full'); 
            document.getElementById('overlay').classList.toggle('hidden'); 
        }

        function addToCart(id) { 
            const p = productos.find(x => x.id === id); 
            const inCart = cart.find(x => x.id === id); 
            if(inCart) inCart.qty++; else cart.push({...p, qty:1}); 
            updateCartUI(); 
        }

        function changeQty(id, delta) { 
            const item = cart.find(x => x.id === id); 
            item.qty += delta; 
            if(item.qty <= 0) cart = cart.filter(x => x.id !== id); 
            updateCartUI(); 
        }

        function updateCartUI() {
            const list = document.getElementById('cartItems'); 
            const badge = document.getElementById('cartCountBadge');
            let total = 0;
            const uniqueItems = cart.length; 

            if(uniqueItems > 0) { badge.innerText = uniqueItems; badge.style.display = 'flex'; } 
            else { badge.style.display = 'none'; }

            list.innerHTML = cart.map(item => {
                total += item.precio * item.qty;
                return `<div class="border-4 border-blue-900 rounded-2xl p-4 bg-white relative">
                    <div class="flex justify-between items-center">
                        <span class="font-bold uppercase text-xs truncate w-32">${item.nombre}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${item.id}, -1)" class="w-7 h-7 border-2 border-black rounded">-</button>
                            <span class="font-black">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-7 h-7 border-2 border-black rounded">+</button>
                        </div>
                    </div>
                    <div class="text-[10px] font-bold italic mt-1">$${item.precio.toLocaleString('es-CL')} c/u</div>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = `$${total.toLocaleString('es-CL')}`;
        }

        function sendOrder() {
            const n = document.getElementById('u_nombre').value; 
            const t = document.getElementById('u_tel').value; 
            if(!n || !t || cart.length === 0) return alert("Completa los datos");
            let msg = `*PEDIDO: LOS MELLYS*%0A%0A*Cliente:* ${n}%0A*Tel:* ${t}%0A------------------%0A`;
            cart.forEach(i => msg += `• ${i.qty}x ${i.nombre}%0A`);
            msg += `------------------%0A*TOTAL: $${document.getElementById('cartTotal').innerText}*`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`);
        }

        function renderAdminList() {
            const list = document.getElementById('adminList');
            list.innerHTML = productosExtra.map(p => `<div class="flex justify-between bg-gray-100 p-2 rounded-lg border text-xs"><span>${p.nombre}</span><button onclick="deleteP(${p.id})" class="text-red-500 font-black px-2">X</button></div>`).join('');
        }
        function deleteP(id) { productosExtra = productosExtra.filter(p => p.id !== id); saveAndRefresh(); }

        renderProducts();
    </script>
</body>
</html>
